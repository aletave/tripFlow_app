spring.application.name=booking-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/booking
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


stripe.api.secret-key=${STRIPE_SECRET_KEY:sk_test_PLACEHOLDER}
stripe.api.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_PLACEHOLDER}

logging.level.com.tripflow.booking=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

tripflow.catalog.base-url=http://localhost:8082

#eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/