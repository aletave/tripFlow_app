spring.application.name=booking-service

#eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
server.port=8083

# JWT - segreto condiviso tra i microservizi per validare il token (stesso di catalog/user-auth)
jwt.secret=${JWT_SECRET:tripflow-dev-secret-tripflow-dev-secret-2026-2026}

spring.datasource.url=jdbc:postgresql://localhost:5433/tripflow_db
spring.datasource.username=tripflow_user
spring.datasource.password=tripflow_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


stripe.api.secret-key=${STRIPE_SECRET_KEY:sk_test_PLACEHOLDER}
stripe.api.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_PLACEHOLDER}

logging.level.com.tripflow.booking=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

tripflow.catalog.base-url=http://localhost:8082

# config x swagger
springdoc.api-docs.path=/v3/api-docs