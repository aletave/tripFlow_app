spring.application.name=booking-service

#eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
server.port=8083

#keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:9090/realms/tripflow}

spring.datasource.url=jdbc:postgresql://localhost:5433/tripflow_booking_db
spring.datasource.username=tripflow_user
spring.datasource.password=tripflow_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


stripe.api.secret-key=${STRIPE_SECRET_KEY:sk_test_PLACEHOLDER}
stripe.api.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_PLACEHOLDER}

logging.level.com.tripflow.booking=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

#una prenotazione IN_ATTESA non pagata entro
#questo tempo scade e libera i posti.
#provata demo a PT2M
booking.prenotazione.ttl=PT10M
booking.prenotazione.finestra-pagamento=PT15M
booking.prenotazione.frequenza-pulizia=PT20S


# config x swagger
springdoc.api-docs.path=/v3/api-docs