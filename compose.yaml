
#config della connessione al db to postgresql-itinerary_service
services:
  postgresql:
    image: postgres:16
    container_name: postgresql-itinerary_service
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: tripflow_user
      POSTGRES_PASSWORD: tripflow_password
      POSTGRES_DB: tripflow_db
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  #RABBITMQ:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped

  #KEYCLOAK:
  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    mem_limit: 512m

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-server
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "9090:8080"
    depends_on:
      - postgres-keycloak
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    mem_limit: 1g

volumes:
  postgresql_data:
  postgres_keycloak_data:
