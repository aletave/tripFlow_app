
#config della connessione al db to postgresql-itinerary_service
services:
  postgresql:
    image: postgres:16
    container_name: postgresql-itinerary_service
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: tripflow_user
      POSTGRES_PASSWORD: tripflow_password
      POSTGRES_DB: tripflow_db
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  #RABBITMQ:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped

  #MAILPIT: fake SMTP server per sviluppo locale.
  #Keycloak invia le email di recupero password a mailpit:1025 (SMTP).
  #Puoi leggere le email ricevute aprendo http://localhost:8025 nel browser.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025" # Porta SMTP su cui Keycloak invia le email
      - "8025:8025" # Web UI per leggere le email intercettate
    restart: unless-stopped

  #KEYCLOAK:
  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    mem_limit: 512m

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-server
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: "http://localhost:9090"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "9090:8080"
    depends_on:
      - postgres-keycloak
      - mailpit
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    mem_limit: 1g

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "8083:8083"
    env_file:
      - path: ./booking-service/.env.stripe
        required: false
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/tripflow_booking_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tripflow/protocol/openid-connect/certs
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_PLACEHOLDER}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_started
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped

  review-service:
    build: ./review-service
    container_name: review-service
    ports:
      - "8085:8085"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/tripflow_review_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tripflow/protocol/openid-connect/certs
    depends_on:
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_started
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
  user-auth-service:
    build: ./user-auth-service
    container_name: user-auth-service
    # nessuna porta pubblica: si passa solo dal gateway (8080), così il rate limit
    # legge un X-Forwarded-For scritto dal gateway e non falsificabile dal client
    expose:
      - "8086"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/tripflow_user_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tripflow/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - user_auth_avatars:/app/uploads/avatars
    depends_on:
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_started
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped
  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    ports:
      - "8084:8084"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/tripflow_catalog_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tripflow/protocol/openid-connect/certs
    depends_on:
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_started
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped

  itinerary-service:
    build: ./itinerary-service
    container_name: itinerary-service
    ports:
      - "8087:8087"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/tripflow_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tripflow/protocol/openid-connect/certs
      USER_AUTH_SERVICE_URL: http://user-auth-service:8086
    depends_on:
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_started
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
      user-auth-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgresql_data:
  postgres_keycloak_data:
  user_auth_avatars:
