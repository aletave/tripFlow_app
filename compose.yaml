
#config della connessione al db to postgresql-itinerary_service
services:
  postgresql:
    image: postgres:16
    container_name: postgresql-itinerary_service
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: tripflow_user
      POSTGRES_PASSWORD: tripflow_password
      POSTGRES_DB: tripflow_db
    volumes:
      - postgresql_data:/var/lib/postgresql/data

  #RABBITMQ:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped

volumes:
  postgresql_data:
