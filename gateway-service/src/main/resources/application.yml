server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

          routes:
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/booking-service/**
              filters:
                - RewritePath=/booking-service/(?<segment>.*), /${segment}

            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/review-service/**
              filters:
                - RewritePath=/review-service/(?<segment>.*), /${segment}

            - id: itinerary-service
              uri: lb://itinerary-service
              predicates:
                - Path=/itinerary-service/**
              filters:
                - RewritePath=/itinerary-service/(?<segment>.*), /${segment}

            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/catalog-service/**
              filters:
                - RewritePath=/catalog-service/(?<segment>.*), /${segment}

            - id: user-auth-service
              uri: lb://USER-AUTH-SERVICE
              predicates:
                - Path=/user-auth-service/**
              filters:
                - RewritePath=/user-auth-service/(?<segment>.*), /${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only

springdoc:
  swagger-ui:
    urls:
      - name: Booking Service
        url: /booking-service/v3/api-docs

      - name: Review Service
        url: /review-service/v3/api-docs

      - name: Itinerary Service
        url: /itinerary-service/v3/api-docs

      - name: Catalog Service
        url: /catalog-service/v3/api-docs

      - name: User Auth Service
        url: /user-auth-service/v3/api-docs