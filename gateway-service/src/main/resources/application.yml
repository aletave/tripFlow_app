server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          # CORS globale sull'entry point (WebFlux): consente a frontend di altri origin
          # di chiamare le API e di leggere le specifiche dei microservizi.
          # NB: in Spring Cloud Gateway 4.3 la property vive sotto server.webflux.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

          discovery:
            locator:
              enabled: true

          routes:
            # Le chiamate client usano il prefisso del microservizio
            # (es. /catalog-service/api/v1/trips): StripPrefix=1 rimuove il primo
            # segmento e inoltra il resto (es. /api/v1/trips) al servizio corretto.
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/booking-service/**
              filters:
                - StripPrefix=1

            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/review-service/**
              filters:
                - StripPrefix=1

            - id: itinerary-service
              uri: lb://itinerary-service
              predicates:
                - Path=/itinerary-service/**
              filters:
                - StripPrefix=1

            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/catalog-service/**
              filters:
                - StripPrefix=1

            - id: user-auth-service
              uri: lb://user-auth-service
              predicates:
                - Path=/user-auth-service/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only

springdoc:
  swagger-ui:
    urls:
      - name: Booking Service
        url: http://localhost:8083/v3/api-docs

      - name: Review Service
        url: http://localhost:8085/v3/api-docs

      - name: Itinerary Service
        url: http://localhost:8087/v3/api-docs

      - name: Catalog Service
        url: http://localhost:8084/v3/api-docs

      # tramite il gateway: la porta 8086 non è pubblica in Docker
      - name: User Auth Service
        url: /user-auth-service/v3/api-docs
