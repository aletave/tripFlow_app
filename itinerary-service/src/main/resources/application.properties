spring.application.name=itinerary-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
server.port=8087

# Connessione PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/tripflow_db
spring.datasource.username=tripflow_user
spring.datasource.password=tripflow_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# config x swagger
springdoc.api-docs.path=/v3/api-docs

#rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Keycloak Security Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/tripflow