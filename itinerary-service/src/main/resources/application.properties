spring.application.name=itinerary-service
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
server.port=8087

# CORS: origini esplicite, nessun wildcard. In produzione sovrascrivere
# CORS_ALLOWED_ORIGINS con le origini reali dei client autorizzati.
tripflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}
tripflow.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# Connessione PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tripflow_db}
spring.datasource.username=${DB_USERNAME:tripflow_user}
spring.datasource.password=${DB_PASSWORD:tripflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Swagger / OpenAPI: disabilitato di default.
# Il profilo dev lo abilita; in produzione resta spento.
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
# Se true gli endpoint Swagger sono pubblici; se false richiedono un JWT valido.
tripflow.swagger.public=${SWAGGER_PUBLIC:false}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Keycloak Security Config
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:9090/realms/tripflow/protocol/openid-connect/certs}

# Comunicazione inter-servizio verso user-auth-service (verifica esistenza utente in fase di condivisione)
tripflow.user-auth-service.base-url=${USER_AUTH_SERVICE_URL:http://localhost:8086}
# Timeout espliciti: un auth-service lento non deve bloccare thread e connessioni DB.
tripflow.user-auth-service.connect-timeout-ms=${USER_AUTH_CONNECT_TIMEOUT_MS:2000}
tripflow.user-auth-service.read-timeout-ms=${USER_AUTH_READ_TIMEOUT_MS:2000}

# Listener RabbitMQ: in caso di errore (es. DB momentaneamente non raggiungibile)
# l'evento viene ritentato alcune volte invece di essere perso o riaccodato all'infinito.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms

# Comunicazione inter-servizio verso catalog-service (verifica di viaggi e attivita' delle tappe)
tripflow.catalog-service.base-url=${CATALOG_SERVICE_URL:http://localhost:8084}
tripflow.catalog-service.connect-timeout-ms=${CATALOG_CONNECT_TIMEOUT_MS:2000}
tripflow.catalog-service.read-timeout-ms=${CATALOG_READ_TIMEOUT_MS:2000}
