spring.application.name=user-auth-service
server.port=${SERVER_PORT:8086}

spring.datasource.url=${DB_URL:jdbc:postgresql://postgresql:5432/tripflow_db}
spring.datasource.username=${DB_USERNAME:tripflow_user}
spring.datasource.password=${DB_PASSWORD:tripflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#keycloak (resource server: validazione JWT via JWKS certs endpoint — docker)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/tripflow/protocol/openid-connect/certs}

#keycloak (admin api)
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://keycloak:8080}
keycloak.realm=tripflow
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.auth-client-id=${KEYCLOAK_AUTH_CLIENT_ID:tripflow-app}
keycloak.auth-client-secret=${KEYCLOAK_AUTH_CLIENT_SECRET:}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# rate limiting
app.rate-limit.enabled=true
app.rate-limit.max-requests-per-window=5
app.rate-limit.window-seconds=60

# upload avatar
app.upload.dir=${UPLOAD_DIR:/app/uploads/avatars}
app.base-url=${BASE_URL:http://localhost:8086}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB