spring.application.name=user-auth-service
server.port=${SERVER_PORT:8086}

spring.datasource.url=${DB_URL:jdbc:postgresql://postgresql:5432/tripflow_db}
spring.datasource.username=${DB_USERNAME:tripflow_user}
spring.datasource.password=${DB_PASSWORD:tripflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#keycloak (resource server: validazione JWT via JWKS certs endpoint — docker)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/tripflow/protocol/openid-connect/certs}

#keycloak (admin api)
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://keycloak:8080}
keycloak.realm=tripflow
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.auth-client-id=${KEYCLOAK_AUTH_CLIENT_ID:tripflow-app}
keycloak.auth-client-secret=${KEYCLOAK_AUTH_CLIENT_SECRET:}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# rate limiting
app.rate-limit.enabled=true
app.rate-limit.max-requests-per-window=5
app.rate-limit.window-seconds=60

# upload avatar
app.upload.dir=${UPLOAD_DIR:/app/uploads/avatars}
app.base-url=${BASE_URL:http://localhost:8086}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# invio email (SMTP) — dentro Docker punta al container mailpit
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:noreply@tripflow.com}
app.mail.from-name=${MAIL_FROM_NAME:TripFlow}

# codici OTP (verifica email e reset password)
app.otp.length=6
app.otp.expiry-minutes=15
app.otp.max-attempts=5
# pulizia periodica dei codici scaduti/consumati (default: ogni ora)
app.otp.cleanup-cron=${OTP_CLEANUP_CRON:0 0 * * * *}

# auguri di compleanno con codice sconto (cron giornaliero)
app.birthday.cron=${BIRTHDAY_CRON:0 0 8 * * *}
app.birthday.zone=${BIRTHDAY_ZONE:Europe/Rome}