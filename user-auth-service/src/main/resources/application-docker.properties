spring.application.name=user-auth-service
server.port=${SERVER_PORT:8086}

spring.datasource.url=${DB_URL:jdbc:postgresql://postgresql:5432/tripflow_db}
spring.datasource.username=${DB_USERNAME:tripflow_user}
spring.datasource.password=${DB_PASSWORD:tripflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#keycloak (dentro la rete Docker: il nome servizio e' "keycloak", non localhost)
keycloak.server-url=http://keycloak:8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/tripflow