spring.application.name=user-auth-service

#eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
server.port=8086

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tripflow_db}
spring.datasource.username=${DB_USERNAME:tripflow_user}
spring.datasource.password=${DB_PASSWORD:tripflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#keycloak (resource server: validazione JWT via JWKS)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/tripflow

#keycloak (admin api per registrazione, cambio password, eliminazione)
keycloak.server-url=http://localhost:9090
keycloak.realm=tripflow
keycloak.admin-username=admin
keycloak.admin-password=admin

# config x swagger
springdoc.api-docs.path=/v3/api-docs

# rate limiting su /api/auth/register (endpoint pubblico)
app.rate-limit.enabled=true
app.rate-limit.max-requests-per-window=5
app.rate-limit.window-seconds=60