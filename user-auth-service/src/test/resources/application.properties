spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/tripflow

keycloak.server-url=http://localhost:9090
keycloak.realm=tripflow
keycloak.admin-username=admin
keycloak.admin-password=admin

#rate limiting disattivato nei test (i test di register non devono incappare nel 429)
app.rate-limit.enabled=false